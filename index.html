<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Link Shopee Có Mã Toàn Sàn</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-md p-5 space-y-4">
        <div class="flex justify-between items-start">
            <h1 class="text-lg font-bold text-gray-800 leading-snug">Đổi link Shopee có mã toàn sàn</h1>
            <span class="bg-indigo-50 text-indigo-600 text-xs font-medium px-2.5 py-1 rounded-full">Chỉ 1 link/lần</span>
        </div>

        <!-- Chọn nguồn mã FB hoặc IG -->
        <div class="flex gap-2">
            <button id="btnFb" onclick="selectSource('fb')" class="flex-1 py-1.5 text-sm font-semibold rounded-lg bg-blue-600 text-white">Mã Facebook (FB)</button>
            <button id="btnIg" onclick="selectSource('ig')" class="flex-1 py-1.5 text-sm font-semibold rounded-lg bg-gray-200 text-gray-700">Mã Instagram (IG)</button>
        </div>

        <!-- Ô nhập link -->
        <div>
            <label class="block text-sm font-semibold text-gray-600 mb-1.5">Nhập link Shopee</label>
            <input type="text" id="inputLink" placeholder="https://s.shopee.vn/..." 
                class="w-full px-3.5 py-2.5 border-2 border-blue-400 rounded-xl focus:outline-none text-sm text-gray-700">
        </div>

        <!-- Các nút chức năng giống hệt mẫu -->
        <div class="space-y-2.5">
            <button onclick="pasteLink()" class="w-full py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold rounded-xl text-sm transition">
                Dán sản phẩm
            </button>

            <button id="convertBtn" onclick="convertLink()" class="w-full py-2.5 bg-indigo-700 hover:bg-indigo-800 text-white font-semibold rounded-xl text-sm transition">
                Nhận voucher
            </button>

            <button id="copyBtn" onclick="copyLink()" class="w-full py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold rounded-xl text-sm transition">
                Sao chép
            </button>
        </div>

        <p id="statusText" class="text-center text-xs font-medium text-green-600 hidden"></p>
    </div>

    <script>
        // https://chigiamgia.hoangthihuonggiang09.workers.dev/
        const WORKER_URL = "https://chigiamgia.hoangthihuonggiang09.workers.dev";
        let currentSource = "fb";
        let convertedResult = "";

        function selectSource(src) {
            currentSource = src;
            document.getElementById('btnFb').className = src === 'fb' 
                ? "flex-1 py-1.5 text-sm font-semibold rounded-lg bg-blue-600 text-white" 
                : "flex-1 py-1.5 text-sm font-semibold rounded-lg bg-gray-200 text-gray-700";
            document.getElementById('btnIg').className = src === 'ig' 
                ? "flex-1 py-1.5 text-sm font-semibold rounded-lg bg-pink-600 text-white" 
                : "flex-1 py-1.5 text-sm font-semibold rounded-lg bg-gray-200 text-gray-700";
        }

        async function pasteLink() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('inputLink').value = text;
                showStatus("Đã dán link!", "text-blue-600");
            } catch (err) {
                showStatus("Trình duyệt chặn tự dán, hãy nhấn giữ vào ô và chọn Dán.", "text-red-500");
            }
        }

        async function convertLink() {
            const rawLink = document.getElementById('inputLink').value.trim();
            if (!rawLink) {
                showStatus("Vui lòng dán link Shopee trước!", "text-red-500");
                return;
            }

            const btn = document.getElementById('convertBtn');
            btn.innerText = "Đang tạo link...";
            btn.disabled = true;

            try {
                const response = await fetch(`${WORKER_URL}?url=${encodeURIComponent(rawLink)}&src=${currentSource}`);
                const data = await response.json();

                if (data.success) {
                    convertedResult = data.link;
                    document.getElementById('inputLink').value = convertedResult;
                    showStatus("Đã đổi link thành công! Bấm Sao chép để dùng.", "text-green-600");
                } else {
                    showStatus("Lỗi: Không nhận diện được link Shopee.", "text-red-500");
                }
            } catch (e) {
                showStatus("Lỗi kết nối server xử lý!", "text-red-500");
            } finally {
                btn.innerText = "Nhận voucher";
                btn.disabled = false;
            }
        }

        function copyLink() {
            const linkToCopy = convertedResult || document.getElementById('inputLink').value;
            if (!linkToCopy) return;
            navigator.clipboard.writeText(linkToCopy);
            showStatus("Đã sao chép link! Mở trên FB/IG để áp mã 22%.", "text-green-600");
        }

        function showStatus(msg, colorClass) {
            const el = document.getElementById('statusText');
            el.innerText = msg;
            el.className = `text-center text-xs font-medium ${colorClass}`;
            el.classList.remove('hidden');
        }
    </script>
</body>
</html>
